<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reader — @classzheng</title>
  <meta name="description" content="Reader: load an article URL into an iframe using ?source=..." />

  <style>
    /* MonoBlack reader page (minimal) */
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0}
    :root{
      --bg:#000;
      --card: rgba(0,0,0,0.45);
      --muted:#8f8f8f;
      --accent:#bdbdbd;
    }
    body{
      font-family: "SFMono-Regular","Roboto Mono",ui-monospace,monospace;
      background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), #000;
      color:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    header.reader-head{
      display:flex;
      gap:12px;
      align-items:center;
      padding:12px 18px;
      background:var(--card);
      border-bottom:1px solid rgba(255,255,255,0.03);
    }

    .title{font-weight:600}
    .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
    .controls input[type="url"]{
      background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:6px;color:var(--accent);min-width:260px;outline:none
    }
    .controls button{
      background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--muted);padding:8px 10px;border-radius:6px;cursor:pointer
    }
    .controls a{color:var(--muted);text-decoration:none;font-size:0.95rem}

    .hint{color:var(--muted);font-size:0.9rem;margin-left:6px}

    /* iframe area fills remaining height */
    .viewer-wrap{flex:1 1 auto; display:flex; min-height:0;}
    iframe.viewer{
      width:100%; border:0; display:block; flex:1 1 auto; min-height:0;
    }

    .placeholder{
      flex:1 1 auto; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:0.95rem;
      padding:28px; text-align:center;
    }

    .notice{padding:10px 14px; background:rgba(255,255,255,0.02); border-radius:6px; color:var(--muted); font-size:0.9rem}

    /* small screens: shrink input */
    @media (max-width:520px){
      .controls input[type="url"]{min-width:140px}
    }
  </style>
</head>
<body>
  <header class="reader-head">
    <div class="brand">
      <span class="title">Reader</span>
      <div class="hint">— view article via iframe (use ?source=URL)</div>
    </div>

    <div class="controls">
      <!-- user can paste or edit the source URL here -->
      <input id="sourceInput" type="url" placeholder="https://example.com/article.html" aria-label="article url" />
      <button id="loadBtn" type="button">Load</button>
      <a id="openLink" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
    </div>
  </header>

  <div class="viewer-wrap">
    <!-- when no source provided we show a friendly placeholder, otherwise the iframe will be used -->
    <div id="placeholder" class="placeholder" role="status">
      Enter a URL (or use ?source=...) to load an article here.
    </div>

    <iframe id="viewer" class="viewer" title="Article viewer" sandbox="" style="display:none"></iframe>
  </div>

  <div style="padding:12px 18px;background:rgba(0,0,0,0.5);border-top:1px solid rgba(255,255,255,0.03);font-size:0.9rem;color:var(--muted);">
    <div id="info" class="notice">Tip: some sites disallow embedding (X-Frame-Options or Content-Security-Policy). If the article does not appear, click "Open in new tab".</div>
  </div>

  <script>
    // Reader logic: get ?source= URL and load into iframe safely
    (function(){
      const input = document.getElementById('sourceInput');
      const loadBtn = document.getElementById('loadBtn');
      const viewer = document.getElementById('viewer');
      const placeholder = document.getElementById('placeholder');
      const openLink = document.getElementById('openLink');
      const info = document.getElementById('info');

      function escapeHtml(s){ return String(s).replace(/[&"'<>]/g, (c)=>({ '&':'&amp;','"':'&quot;','\'':'&#39;','<':'&lt;','>':'&gt;' }[c])); }

      function isValidURL(url){
        try{
          const u = new URL(url, location.href);
          return u.protocol==='http:'||u.protocol==='https:';
        }catch(e){ return false; }
      }

      function setOpenLink(url){
        openLink.href = url || '#';
        if(!url) openLink.setAttribute('aria-disabled','true'); else openLink.removeAttribute('aria-disabled');
      }

      function showPlaceholder(msg){
        viewer.style.display = 'none';
        viewer.src = 'about:blank';
        placeholder.style.display = 'flex';
        placeholder.innerHTML = escapeHtml(msg || 'Enter a URL (or use ?source=...) to load an article here.');
        setOpenLink('');
      }

      function showViewer(url){
        // Use about:blank first to clear previous content, then set src to avoid some race cases
        placeholder.style.display = 'none';
        viewer.style.display = 'block';
        // remove sandbox to allow normal rendering; comment this out if you want a restricted sandbox.
        viewer.removeAttribute('sandbox');
        // set src
        try{
          viewer.src = url;
          setOpenLink(url);
          // update address bar for convenience (not navigational push)
          const newUrl = new URL(location.href);
          newUrl.searchParams.set('source', url);
          history.replaceState(null,'', newUrl.toString());
        }catch(e){
          showPlaceholder('Invalid URL');
        }
      }

      // If iframe is blocked by X-Frame-Options/CSP it may show an error or a blank box. We can't reliably detect that across origins; provide guidance.
      viewer.addEventListener('load', function(){
        // When same-origin, we could inspect document; for cross-origin just update info
        info.textContent = 'Loaded in iframe. If the page stays blank, the target host may disallow embedding; use "Open in new tab".';
      });

      loadBtn.addEventListener('click', function(){
        const v = input.value.trim();
        if(!v){ showPlaceholder('Please enter a URL.'); return; }
        if(!isValidURL(v)) { showPlaceholder('Only http:// or https:// URLs are allowed.'); return; }
        showViewer(v);
      });

      input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ loadBtn.click(); }});

      // Initialize from query param
      const params = new URLSearchParams(location.search);
      const source = params.get('source');
      if(source && isValidURL(source)){
        input.value = source;
        showViewer(source);
      }else{
        if(source) {
          // invalid source provided
          input.value = source;
          showPlaceholder('The provided source parameter is not a valid http(s) URL.');
        } else {
          showPlaceholder();
        }
      }

      // Accessibility: clicking Open in new tab should open the current input or source
      openLink.addEventListener('click', function(e){
        const href = openLink.getAttribute('href');
        if(!href || href === '#'){
          e.preventDefault();
        }
      });

      // Expose simple helpers for debugging in console
      window.__reader = { showViewer, showPlaceholder, isValidURL };
    })();
  </script>
</body>
</html>
